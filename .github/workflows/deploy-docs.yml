name: 部署文档

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发

# 🎯 必须指定写权限，避免部署卡在权限不足的问题上
permissions:
  contents: write

jobs:
  deploy-gh-pages:
    # 🎯 避免多次并发部署导致冲突
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 🎯 一站式完成 pnpm 11+ 与 Node.js 24 部署并自动安装依赖
      - name: Setup pnpm & Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:build

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/.vuepress/dist
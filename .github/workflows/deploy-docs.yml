name: 部署文档

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支援手動觸發

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🎯 升級至支援 pnpm v11 的全新整合式 Action 步驟，並自動管理快取
      - name: 安装 pnpm & 设置 Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: false # 關閉內建預設安裝，改在下方手動放行構建

      - name: 设置 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 🎯 解決 pnpm v11 腳本攔截的核心命令！
      - name: 允許核心二進位檔腳本並安裝依賴
        run: |
          pnpm config set ignore-scripts false
          pnpm install

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:build

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/.vuepress/dist
